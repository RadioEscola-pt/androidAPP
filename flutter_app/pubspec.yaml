name: escola_radio_amador
description: "Escola de Radio Amador - App de estudo para exame de radioamador"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  url_launcher: ^6.3.1
  flutter_html: ^3.0.0-beta.2
  share_plus: ^13.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # Generated by `bun run content:build --mobile=<this dir>` in the
    # hamradiostudy repo. Do not hand-edit: `content:check` fails there if
    # these stop matching content/questions/, which is the source of truth.
    - assets/content/
    - assets/images/cat1/
    - assets/images/cat2/
    - assets/images/cat3/
